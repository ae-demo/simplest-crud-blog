openapi: 3.0.3
info:
  title: Blog API
  version: 0.1.0
  description: Posts and comments for the simplest-crud-blog.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            posts:read: Every published post
            posts:create: Create a new post
            posts:update: Edit an existing post
            posts:delete: Delete a post
            comments:read: Every comment on a post
            comments:create: Add a comment to a post
            comments:delete: Remove any comment
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Post:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    PostInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
    Comment:
      type: object
      required: [id, postId, authorName, body, createdAt]
      properties:
        id: { type: string }
        postId: { type: string }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
security:
  - oauth2: []
paths:
  /posts:
    get:
      operationId: listPosts
      summary: Every published post
      security:
        - oauth2: [posts:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of posts
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Post' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createPost
      summary: Create a new post
      security:
        - oauth2: [posts:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400':
          description: Invalid post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /posts/{postId}:
    get:
      operationId: getPost
      summary: A single post
      security:
        - oauth2: [posts:read]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404':
          description: No such post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updatePost
      summary: Edit an existing post
      security:
        - oauth2: [posts:update]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400':
          description: Invalid post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deletePost
      summary: Delete a post
      security:
        - oauth2: [posts:delete]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Post deleted
        '404':
          description: No such post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /posts/{postId}/comments:
    get:
      operationId: listComments
      summary: Every comment on a post
      security:
        - oauth2: [comments:read]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of comments
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
        '404':
          description: No such post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createComment
      summary: Add a comment to a post
      security:
        - oauth2: [comments:create]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          description: Invalid comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /posts/{postId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Remove any comment
      security:
        - oauth2: [comments:delete]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Comment deleted
        '404':
          description: No such comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
